spring:
  datasource:
    url: jdbc:h2:mem:won_common_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

internal:
  service-id: won-common
  auth:
    allowed-service-ids: won-card-channel,won-invest-channel
    api-key: test-internal-api-key
  services:
    ai-server:
      base-url: http://localhost:18080
    card-channel:
      base-url: http://localhost:18081
    invest-channel:
      base-url: http://localhost:18082
