name: CI and CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  APP_DIR: /opt/won-common
  SERVICE_NAME: won-common

jobs:
  ci:
    name: Test and build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon

  cd:
    name: Deploy jar to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon

      - name: Prepare deployment files
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          APP_USER: ${{ secrets.APP_USER }}
          SERVER_PORT: "8080"
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          INTERNAL_SERVICE_ID: won-common
          INTERNAL_ALLOWED_SERVICE_IDS: ${{ secrets.INTERNAL_ALLOWED_SERVICE_IDS }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          AI_SERVER_BASE_URL: ${{ secrets.AI_SERVER_BASE_URL }}
          CARD_CHANNEL_BASE_URL: ${{ secrets.CARD_CHANNEL_BASE_URL }}
          INVEST_CHANNEL_BASE_URL: ${{ secrets.INVEST_CHANNEL_BASE_URL }}
        run: |
          set -euo pipefail

          mkdir -p deploy
          cp build/libs/*.jar deploy/app.jar

          printf '%s\n' "$EC2_KEY" > deploy/ec2_key.pem
          chmod 600 deploy/ec2_key.pem

          cat > deploy/won-common.env <<EOF
          SPRING_PROFILES_ACTIVE=prod
          SERVER_PORT=${SERVER_PORT}
          MYSQL_HOST=${MYSQL_HOST}
          MYSQL_PORT=${MYSQL_PORT:-3306}
          MYSQL_DATABASE=${MYSQL_DATABASE:-won_common_db}
          MYSQL_USER=${MYSQL_USER}
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          INTERNAL_SERVICE_ID=${INTERNAL_SERVICE_ID}
          INTERNAL_ALLOWED_SERVICE_IDS=${INTERNAL_ALLOWED_SERVICE_IDS}
          INTERNAL_API_KEY=${INTERNAL_API_KEY}
          AI_SERVER_BASE_URL=${AI_SERVER_BASE_URL}
          CARD_CHANNEL_BASE_URL=${CARD_CHANNEL_BASE_URL}
          INVEST_CHANNEL_BASE_URL=${INVEST_CHANNEL_BASE_URL}
          TZ=Asia/Seoul
          EOF

          cat > deploy/won-common.service <<EOF
          [Unit]
          Description=WON Common Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=${APP_USER}
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=${APP_DIR}/.env
          ExecStart=/usr/bin/java -jar ${APP_DIR}/app.jar
          SuccessExitStatus=143
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Upload jar and environment
        env:
          BASTION_USER: ${{ secrets.BASTION_USER }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          APP_USER: ${{ secrets.APP_USER }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail

          scp \
            -i deploy/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyJump="${BASTION_USER}@${BASTION_HOST}" \
            deploy/app.jar deploy/won-common.env deploy/won-common.service \
            "${APP_USER}@${APP_HOST}:/tmp/"

      - name: Restart application
        env:
          BASTION_USER: ${{ secrets.BASTION_USER }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          APP_USER: ${{ secrets.APP_USER }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i deploy/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyJump="${BASTION_USER}@${BASTION_HOST}" \
            "${APP_USER}@${APP_HOST}" \
            "sudo mkdir -p ${APP_DIR} && \
             sudo mv /tmp/app.jar ${APP_DIR}/app.jar && \
             sudo mv /tmp/won-common.env ${APP_DIR}/.env && \
             sudo mv /tmp/won-common.service /etc/systemd/system/${SERVICE_NAME}.service && \
             sudo chown -R ${APP_USER}:${APP_USER} ${APP_DIR} && \
             sudo chmod 600 ${APP_DIR}/.env && \
             sudo chmod 644 /etc/systemd/system/${SERVICE_NAME}.service && \
             sudo systemctl daemon-reload && \
             sudo systemctl enable ${SERVICE_NAME} && \
             sudo systemctl restart ${SERVICE_NAME}"

      - name: Health check
        env:
          BASTION_USER: ${{ secrets.BASTION_USER }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          APP_USER: ${{ secrets.APP_USER }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i deploy/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyJump="${BASTION_USER}@${BASTION_HOST}" \
            "${APP_USER}@${APP_HOST}" \
            "for i in \$(seq 1 30); do \
               BODY=\$(curl -fsS http://localhost:8080/actuator/health || true); \
               echo \"[\$i] \$BODY\"; \
               echo \"\$BODY\" | grep -q '\"status\":\"UP\"' && exit 0; \
               sleep 3; \
             done; \
             sudo journalctl -u ${SERVICE_NAME} -n 120 --no-pager; \
             exit 1"
