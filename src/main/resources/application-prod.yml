spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:won_common_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

internal:
  service-id: ${INTERNAL_SERVICE_ID}
  auth:
    allowed-service-ids: ${INTERNAL_ALLOWED_SERVICE_IDS}
    api-key: ${INTERNAL_API_KEY}
  services:
    ai-server:
      base-url: ${AI_SERVER_BASE_URL}
    card-channel:
      base-url: ${CARD_CHANNEL_BASE_URL}
    invest-channel:
      base-url: ${INVEST_CHANNEL_BASE_URL}
